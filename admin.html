<!DOCTYPE html>
<html>
<head>
  <title>Visitor Logs</title>
  <style>
    body { font-family: Arial; padding: 10px; }
    h2 { margin-bottom: 5px; }

    .topbar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    input {
      padding: 6px;
      font-size: 13px;
      width: 220px;
    }

    button {
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background: #222; color: white; position: sticky; top: 0; }
    tr:nth-child(even) { background: #f5f5f5; }
  </style>
</head>
<body>

<h2>Visitor Logs</h2>

<div class="topbar">
  <strong id="count">Total: 0</strong>
  <input type="text" id="search" placeholder="Search IP, city, country...">
  <button onclick="loadData()">🔄 Refresh</button>
</div>

<table id="table">
  <thead>
    <tr>
      <th>IP</th>
      <th>Country</th>
      <th>Region</th>
      <th>City</th>
      <th>Timezone</th>
      <th>ISP</th>
      <th>OS</th>
      <th>Page</th>
      <th>Referrer</th>
      <th>Time</th>
      <th>Map</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
let allData = [];

function loadData() {
  fetch('/api/visitors')
    .then(res => res.json())
    .then(data => {
      allData = data;
      document.getElementById("count").innerText = "Total: " + data.length;
      render(data);
    });
}

function render(data) {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  data.forEach(v => {
    const mapLink = (v.latitude && v.longitude)
      ? `<a href="https://www.google.com/maps?q=${v.latitude},${v.longitude}" target="_blank">View</a>`
      : "-";

    const row = `
      <tr>
        <td>${v.ip || "-"}</td>
        <td>${v.country || "-"}</td>
        <td>${v.region || "-"}</td>
        <td>${v.city || "-"}</td>
        <td>${v.timezone || "-"}</td>
        <td>${v.isp || "-"}</td>
        <td>${v.os || "-"}</td>
        <td>${v.page || "-"}</td>
        <td>${v.referrer || "-"}</td>
        <td>${v.created_at ? new Date(v.created_at).toLocaleString() : "-"}</td>
        <td>${mapLink}</td>
      </tr>
    `;
    tbody.innerHTML += row;
  });
}

// Search filter
document.getElementById("search").addEventListener("input", e => {
  const value = e.target.value.toLowerCase();
  const filtered = allData.filter(v =>
    JSON.stringify(v).toLowerCase().includes(value)
  );
  render(filtered);
});

// Load data when page opens
loadData();
</script>

</body>
</html>
