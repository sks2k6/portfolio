    <!-- ✅ Visitor logger (works with Vite + React) -->
    <script>
      function logVisit() {
        const ref = document.referrer || "Direct";
        const page = window.location.pathname + window.location.search;
        const time = new Date().toISOString();
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

        fetch(`/api/log?page=${encodeURIComponent(page)}&ref=${encodeURIComponent(ref)}&time=${encodeURIComponent(time)}&tz=${encodeURIComponent(tz)}`)
          .catch(() => {}); // prevent console errors
      }

      // Log once on page load
      logVisit();

      // Log again when SPA route changes (React navigation)
      const pushState = history.pushState;
      history.pushState = function () {
        pushState.apply(history, arguments);
        logVisit();
      };

      window.addEventListener("popstate", logVisit);
    </script>
